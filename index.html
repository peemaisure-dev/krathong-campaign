<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ลอยกระทงสายแมว — กิจกรรมหาเสียง</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-cream: #FFFDF9;
      --ink: #2D2A32;
      --muted: #6B6575;
      --accent: #E06D85;
      --accent-soft: #FCE7EC;
      --card-border: #E8E0D5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Prompt', sans-serif;
      background: var(--bg-cream);
      color: var(--ink);
      min-height: 100vh;
    }

    .screen {
      display: none;
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 18px 48px;
    }

    .screen.active { display: block; }

    .card {
      background: #FFFFFF;
      border: 1.5px solid var(--card-border);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(45, 42, 50, 0.06);
    }

    h1, h2, h3 { margin-top: 0; }

    .input-name {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      font-family: inherit;
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      margin: 12px 0 18px;
      outline: none;
    }

    .input-name:focus { border-color: var(--accent); }

    .btn {
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      padding: 12px 22px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .btn:hover { filter: brightness(0.96); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .q-box {
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      background: #FFFEFC;
    }

    .q-title { font-weight: 600; margin-bottom: 10px; }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .choice-btn {
      padding: 10px 8px;
      border-radius: 12px;
      border: 1.5px solid var(--card-border);
      background: #FFFFFF;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
    }

    .choice-btn.selected {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #9E2A45;
      font-weight: 700;
    }

    .result-img {
      width: 220px;
      height: 220px;
      object-fit: contain;
      display: block;
      margin: 12px auto 18px;
    }

    .river-screen {
      max-width: 100%;
      padding: 0;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .river-top-bar {
      position: relative;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: rgba(255, 253, 249, 0.92);
      backdrop-filter: blur(6px);
      border-bottom: 1.5px solid var(--card-border);
      gap: 10px;
      flex-wrap: wrap;
    }

    .river-stage {
      position: relative;
      width: 100%;
      height: calc(100vh - 64px);
      min-height: 540px;
      background-color: #18223A;
      background-image: url("assets/background-temple-night.png");
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      overflow: hidden;
    }

    .floating-krathong {
      position: absolute;
      left: -170px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      animation-name: floatLeftToRight;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }

    .floating-krathong img {
      width: clamp(82px, 11vw, 114px);
      height: clamp(82px, 11vw, 114px);
      object-fit: contain;
      filter: drop-shadow(0 8px 12px rgba(8, 15, 30, 0.55));
    }

    .krathong-tag {
      margin-top: -6px;
      background: rgba(255, 253, 249, 0.95);
      border: 1.5px solid #2D2A32;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #2D2A32;
      white-space: nowrap;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
    }

    @keyframes floatLeftToRight {
      0% { transform: translateX(0) translateY(0px); }
      50% { transform: translateX(calc(50vw + 85px)) translateY(-4px); }
      100% { transform: translateX(calc(100vw + 220px)) translateY(0px); }
    }
  </style>
</head>
<body>

  <!-- หน้า 1: กรอกชื่อ -->
  <section id="screenName" class="screen active">
    <div class="card">
      <h1>ลอยกระทงสายแมว</h1>
      <p style="color: var(--muted);">กรอกชื่อที่อยากให้แสดงบนกระทงของคุณได้เลย (ตั้งชื่ออะไรก็ได้)</p>
      <form id="nameForm">
        <input id="playerNameInput" class="input-name" type="text" maxlength="24" placeholder="พิมพ์ชื่อที่อยากให้แสดง..." required />
        <button class="btn" type="submit">ไปทำแบบสอบถาม 20 ข้อ →</button>
      </form>
    </div>
  </section>

  <!-- หน้า 2: แบบสอบถาม 20 ข้อ -->
  <section id="screenQuiz" class="screen">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h2 style="margin:0;">แบบสอบถามบุคลิก 20 ข้อ</h2>
        <span id="progressText" style="color:var(--muted); font-weight:600;">ตอบแล้ว 0 / 20</span>
      </div>
      <div id="questionsList"></div>
      <button id="submitQuizBtn" class="btn" style="width:100%; margin-top:10px;" disabled>ดูผลลัพธ์กระทงแมวของฉัน</button>
    </div>
  </section>

  <!-- หน้า 3: ผลลัพธ์แมว -->
  <section id="screenResult" class="screen">
    <div class="card" style="text-align:center;">
      <p id="resultPlayerSub" style="color:var(--muted); margin-bottom:4px;"></p>
      <h2 id="resultCatTitle" style="font-size:1.6rem;"></h2>
      <img id="resultCatImg" class="result-img" src="" alt="" />
      <p id="resultCatDesc" style="color:var(--muted); line-height:1.6; max-width:520px; margin:0 auto 22px;"></p>
      <button id="goFloatBtn" class="btn">นำไปลอยกระทง</button>
    </div>
  </section>

  <!-- หน้า 4: หน้าต่างลอยกระทง -->
  <section id="screenRiver" class="screen river-screen">
    <div class="river-top-bar">
      <div>
        <strong>แม่น้ำหน้าวัด</strong> • <span id="riverStatusText" style="color:var(--muted); font-size:0.9rem;">เชื่อมต่อฐานข้อมูลสด • แสดงสูงสุด 10 ลำ</span>
      </div>
      <button id="restartBtn" class="btn" style="padding:8px 14px; font-size:0.88rem;">เริ่มใหม่</button>
    </div>
    <div id="riverStage" class="river-stage"></div>
  </section>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      query,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAPaoaKdXFTWZkDqVWGtX5q6S2tAshND1U",
      authDomain: "krathong-cat-live.firebaseapp.com",
      projectId: "krathong-cat-live",
      storageBucket: "krathong-cat-live.firebasestorage.app",
      messagingSenderId: "629027534766",
      appId: "1:629027534766:web:9f71b3e32ebd5dc9bc7a3f",
      measurementId: "G-GMXRQEKZ8F"
    };

    const app = initializeApp(FIREBASE_CONFIG);
    const db = getFirestore(app);
    const krathongsCol = collection(db, "krathongs");

    const CATS = {
      tabby: {
        name: "แมวสลิดเทา",
        img: "assets/cat-tabby.png",
        desc: "นิสัยชิวๆ ตามใจฉัน ตามอารมณ์ตัวเอง"
      },
      wichianmat: {
        name: "แมววิเชียรมาศ",
        img: "assets/cat-wichianmat.png",
        desc: "ดูเป็นผู้ดีขี้แกล้ง ชอบเล่นอะไรเล็กๆ แกล้งอะไรหน่อยๆ แต่ก็ยังคงความผู้ดี"
      },
      orange: {
        name: "แมวส้ม",
        img: "assets/cat-orange.png",
        desc: "ขี้แกล้ง ขี้เล่น กวนตีน ดื้อ แมวเป้าสุดๆ"
      },
      black: {
        name: "แมวดำ",
        img: "assets/cat-black.png",
        desc: "ขี้เซา สบายๆ ชอบนอน น่ารัก"
      },
      white: {
        name: "แมวขาว",
        img: "assets/cat-white.png",
        desc: "ผู้ดีแท้ๆ ดูสง่าไปหมด"
      },
      seal: {
        name: "แมวน้ำ",
        img: "assets/cat-seal.png",
        desc: "ตัวซีเคร็ท ไม่มีใครเหมือน แปลกและแตกต่าง อ้วน"
      }
    };

    const QUESTIONS = [
      { id: 1, q: "1) นอนตื่น 8 โมง", opts: { always: ["white", "seal"], sometimes: ["tabby", "orange"], never: ["black", "wichianmat"] } },
      { id: 2, q: "2) ชอบไปเล่นกับแมว", opts: { always: ["orange", "white"], sometimes: ["wichianmat", "black"], never: ["seal", "tabby"] } },
      { id: 3, q: "3) เห็นแมวทีไร ชอบเอามือถือขึ้นมาถ่าย", opts: { always: ["wichianmat", "tabby"], sometimes: ["orange", "black"], never: ["white", "seal"] } },
      { id: 4, q: "4) เข้าเรียนทุกคาบไม่เคยขาด", opts: { always: ["white", "orange"], sometimes: ["tabby", "wichianmat"], never: ["black", "seal"] } },
      { id: 5, q: "5) กินข้าวเสร็จคนสุดท้ายของกลุ่มเสมอ", opts: { always: ["black", "wichianmat"], sometimes: ["seal", "white"], never: ["orange", "tabby"] } },
      { id: 6, q: "6) ได้เกรด 3.5 ขึ้นไป", opts: { always: ["white", "black"], sometimes: ["wichianmat", "orange"], never: ["seal", "tabby"] } },
      { id: 7, q: "7) ติดของหวาน", opts: { always: ["seal", "white"], sometimes: ["orange", "black"], never: ["tabby", "wichianmat"] } },
      { id: 8, q: "8) ชอบกินเผ็ด", opts: { always: ["orange", "tabby"], sometimes: ["wichianmat", "seal"], never: ["black", "white"] } },
      { id: 9, q: "9) รับรางวัลหน้าเสาธง", opts: { always: ["white", "orange"], sometimes: ["wichianmat", "black"], never: ["tabby", "seal"] } },
      { id: 10, q: "10) ชอบอ้อนแฟน", opts: { always: ["orange", "white"], sometimes: ["black", "wichianmat"], never: ["seal", "tabby"] } },
      { id: 11, q: "11) ชอบประหยัด", opts: { always: ["black", "seal"], sometimes: ["tabby", "orange"], never: ["wichianmat", "white"] } },
      { id: 12, q: "12) ส่งงานตรงเวลา", opts: { always: ["wichianmat", "tabby"], sometimes: ["white", "black"], never: ["orange", "seal"] } },
      { id: 13, q: "13) ชอบหลับในคาบ", opts: { always: ["black", "white"], sometimes: ["tabby", "wichianmat"], never: ["orange", "seal"] } },
      { id: 14, q: "14) นั่งนิ่งๆ แต่จริงๆ นั่งคิดอะไรไปเรื่อย", opts: { always: ["tabby", "orange"], sometimes: ["seal", "white"], never: ["wichianmat", "black"] } },
      { id: 15, q: "15) ชอบบิดขี้เกียจ", opts: { always: ["black", "wichianmat"], sometimes: ["tabby", "white"], never: ["orange", "seal"] } },
      { id: 16, q: "16) นอนดึก", opts: { always: ["tabby", "white"], sometimes: ["orange", "black"], never: ["wichianmat", "seal"] } },
      { id: 17, q: "17) จีบคนเก่ง", opts: { always: ["orange", "white"], sometimes: ["wichianmat", "seal"], never: ["tabby", "black"] } },
      { id: 18, q: "18) ชอบกอดแม่", opts: { always: ["black", "tabby"], sometimes: ["wichianmat", "seal"], never: ["white", "orange"] } },
      { id: 19, q: "19) ชอบดูอนิเมะ", opts: { always: ["seal", "tabby"], sometimes: ["white", "orange"], never: ["black", "wichianmat"] } },
      { id: 20, q: "20) ติดซีรี่ย์", opts: { always: ["seal", "black"], sometimes: ["tabby", "orange"], never: ["white", "wichianmat"] } }
    ];

    let playerName = "";
    let answers = {};
    let chosenCatKey = "tabby";
    let livePool = [];
    let unsubscribeLive = null;
    let spawnTimer = null;
    let pendingQueue = [];
    let activeIds = new Set();
    let laneIndex = 0;
    const MAX_ON_SCREEN = 10;

    function getRiverLanes() {
      const stage = document.getElementById("riverStage");
      const h = stage ? stage.clientHeight : 600;
      const isPortrait = window.innerHeight > window.innerWidth;
      if (isPortrait) {
        return [
          Math.round(h * 0.64),
          Math.round(h * 0.70),
          Math.round(h * 0.76),
          Math.round(h * 0.82)
        ];
      }
      return [
        Math.round(h * 0.62),
        Math.round(h * 0.69),
        Math.round(h * 0.76),
        Math.round(h * 0.83)
      ];
    }

    function showScreen(id) {
      document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    function renderQuestions() {
      const wrap = document.getElementById("questionsList");
      wrap.innerHTML = QUESTIONS.map((item) => `
        <div class="q-box">
          <div class="q-title">${item.q}</div>
          <div class="choices">
            <button type="button" class="choice-btn" data-qid="${item.id}" data-val="always">ประจำ</button>
            <button type="button" class="choice-btn" data-qid="${item.id}" data-val="sometimes">บางครั้ง</button>
            <button type="button" class="choice-btn" data-qid="${item.id}" data-val="never">ไม่เคย</button>
          </div>
        </div>
      `).join("");

      wrap.querySelectorAll(".choice-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const qid = Number(btn.dataset.qid);
          const val = btn.dataset.val;
          answers[qid] = val;
          wrap.querySelectorAll(`[data-qid="${qid}"]`).forEach((b) => b.classList.remove("selected"));
          btn.classList.add("selected");
          const count = Object.keys(answers).length;
          document.getElementById("progressText").innerText = `ตอบแล้ว ${count} / 20`;
          document.getElementById("submitQuizBtn").disabled = count < 20;
        });
      });
    }

    function calculateWinnerCat() {
      const scores = { tabby: 0, wichianmat: 0, orange: 0, black: 0, white: 0, seal: 0 };
      QUESTIONS.forEach((item) => {
        const picked = answers[item.id];
        const [plusCat, minusCat] = item.opts[picked];
        scores[plusCat] += 1;
        scores[minusCat] -= 1;
      });

      const maxScore = Math.max(...Object.values(scores));
      const topCats = Object.keys(scores).filter((k) => scores[k] === maxScore);
      return topCats[Math.floor(Math.random() * topCats.length)];
    }

    function spawnOneKrathong(entry) {
      const stage = document.getElementById("riverStage");
      if (!stage || !entry || activeIds.has(entry.id) || activeIds.size >= MAX_ON_SCREEN) return;

      const cat = CATS[entry.cat] || CATS.tabby;
      const lanes = getRiverLanes();
      const topPx = lanes[laneIndex % lanes.length];
      laneIndex += 1;

      const el = document.createElement("div");
      el.className = "floating-krathong";
      const durationSec = 14 + Math.random() * 4;

      el.style.top = `${topPx}px`;
      el.style.animationDuration = `${durationSec}s`;
      el.innerHTML = `<img src="${cat.img}" alt="${cat.name}" /><span class="krathong-tag">${entry.name}</span>`;

      activeIds.add(entry.id);
      stage.appendChild(el);

      el.addEventListener("animationend", () => {
        el.remove();
        activeIds.delete(entry.id);
      });
    }

    function spawnNextAvailable() {
      if (!livePool.length) return;
      const cap = Math.min(MAX_ON_SCREEN, livePool.length);
      if (activeIds.size >= cap) return;

      while (pendingQueue.length > 0) {
        const queued = pendingQueue.shift();
        if (queued && !activeIds.has(queued.id)) {
          spawnOneKrathong(queued);
          return;
        }
      }

      const available = livePool.filter((item) => !activeIds.has(item.id));
      if (!available.length) return;
      const picked = available[Math.floor(Math.random() * available.length)];
      spawnOneKrathong(picked);
    }

    function subscribeKrathongsLive(myDocId) {
      if (unsubscribeLive) unsubscribeLive();
      const q = query(krathongsCol, orderBy("createdAt", "desc"), limit(100));

      unsubscribeLive = onSnapshot(q, (snapshot) => {
        livePool = snapshot.docs.map((docSnap) => ({
          id: docSnap.id,
          name: docSnap.data().name || "ผู้ร่วมลอย",
          cat: docSnap.data().cat || "tabby"
        }));

        document.getElementById("riverStatusText").innerText =
          `ผู้ร่วมลอยในระบบ ${livePool.length} ลำ • แสดงสูงสุด ${MAX_ON_SCREEN} ลำ`;

        if (myDocId && !activeIds.has(myDocId)) {
          const mine = livePool.find((item) => item.id === myDocId);
          if (mine && !pendingQueue.some((p) => p.id === mine.id)) {
            pendingQueue.unshift(mine);
          }
        }

        spawnNextAvailable();
      });
    }

    async function startRiverLoop() {
      clearInterval(spawnTimer);
      document.querySelectorAll(".floating-krathong").forEach((n) => n.remove());
      activeIds.clear();
      pendingQueue = [];
      laneIndex = 0;

      const btn = document.getElementById("goFloatBtn");
      btn.disabled = true;

      let myDocId = null;
      try {
        const docRef = await addDoc(krathongsCol, {
          name: playerName,
          cat: chosenCatKey,
          createdAt: serverTimestamp()
        });
        myDocId = docRef.id;
      } catch (err) {
        console.error("บันทึกลง Firestore ไม่สำเร็จ:", err);
      } finally {
        btn.disabled = false;
      }

      subscribeKrathongsLive(myDocId);
      spawnTimer = setInterval(() => {
        spawnNextAvailable();
      }, 2200);
    }

    document.getElementById("nameForm").addEventListener("submit", (e) => {
      e.preventDefault();
      playerName = document.getElementById("playerNameInput").value.trim() || "ผู้ร่วมลอย";
      answers = {};
      renderQuestions();
      document.getElementById("progressText").innerText = "ตอบแล้ว 0 / 20";
      document.getElementById("submitQuizBtn").disabled = true;
      showScreen("screenQuiz");
    });

    document.getElementById("submitQuizBtn").addEventListener("click", () => {
      chosenCatKey = calculateWinnerCat();
      const cat = CATS[chosenCatKey];
      document.getElementById("resultPlayerSub").innerText = `กระทงของ "${playerName}"`;
      document.getElementById("resultCatTitle").innerText = `ได้${cat.name}`;
      document.getElementById("resultCatImg").src = cat.img;
      document.getElementById("resultCatImg").alt = cat.name;
      document.getElementById("resultCatDesc").innerText = cat.desc;
      showScreen("screenResult");
    });

    document.getElementById("goFloatBtn").addEventListener("click", async () => {
      showScreen("screenRiver");
      await startRiverLoop();
    });

    document.getElementById("restartBtn").addEventListener("click", () => {
      clearInterval(spawnTimer);
      if (unsubscribeLive) unsubscribeLive();
      activeIds.clear();
      document.getElementById("playerNameInput").value = "";
      showScreen("screenName");
    });
  </script>
</body>
</html>
