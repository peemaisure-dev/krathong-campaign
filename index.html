<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ลอยกระทงสายแมว — กิจกรรมหาเสียง</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-cream: #FFFDF9;
      --ink: #2D2A32;
      --muted: #6B6575;
      --accent: #E06D85;
      --accent-soft: #FCE7EC;
      --card-border: #E8E0D5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Prompt', sans-serif;
      background: var(--bg-cream);
      color: var(--ink);
      min-height: 100vh;
    }

    .screen {
      display: none;
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 18px 48px;
    }

    .screen.active { display: block; }

    .card {
      background: #FFFFFF;
      border: 1.5px solid var(--card-border);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(45, 42, 50, 0.06);
    }

    h1, h2, h3 { margin-top: 0; }

    .input-name {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      font-family: inherit;
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      margin: 12px 0 18px;
      outline: none;
    }

    .input-name:focus { border-color: var(--accent); }

    .btn {
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      padding: 12px 22px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .btn:hover { filter: brightness(0.96); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .q-box {
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      background: #FFFEFC;
    }

    .q-title { font-weight: 600; margin-bottom: 10px; }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .choice-btn {
      padding: 10px 8px;
      border-radius: 12px;
      border: 1.5px solid var(--card-border);
      background: #FFFFFF;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
    }

    .choice-btn.selected {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #9E2A45;
      font-weight: 700;
    }

    .result-img {
      width: 220px;
      height: 220px;
      object-fit: contain;
      display: block;
      margin: 12px auto 18px;
    }

    .river-screen {
      max-width: 100%;
      padding: 0;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .river-top-bar {
      position: relative;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: rgba(255, 253, 249, 0.92);
      backdrop-filter: blur(6px);
      border-bottom: 1.5px solid var(--card-border);
      gap: 10px;
      flex-wrap: wrap;
    }

    .river-stage {
      position: relative;
      width: 100%;
      height: calc(100vh - 64px);
      min-height: 540px;
      background: linear-gradient(180deg, #1B2244 0%, #2E3463 45%, #1E3A5F 48%, #142847 100%);
      overflow: hidden;
    }

    .night-scene-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .floating-krathong {
      position: absolute;
      left: -170px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      animation-name: floatLeftToRight;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }

    .floating-krathong img {
      width: 112px;
      height: 112px;
      object-fit: contain;
      filter: drop-shadow(0 8px 12px rgba(8, 15, 30, 0.55));
    }

    .krathong-tag {
      margin-top: -6px;
      background: rgba(255, 253, 249, 0.95);
      border: 1.5px solid #2D2A32;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #2D2A32;
      white-space: nowrap;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
    }

    @keyframes floatLeftToRight {
      0% { transform: translateX(0) translateY(0px); }
      50% { transform: translateX(calc(50vw + 85px)) translateY(-5px); }
      100% { transform: translateX(calc(100vw + 220px)) translateY(0px); }
    }
  </style>
</head>
<body>

  <!-- หน้า 1: กรอกชื่อ -->
  <section id="screenName" class="screen active">
    <div class="card">
      <h1>ลอยกระทงสายแมว</h1>
      <p style="color: var(--muted);">กรอกชื่อที่อยากให้แสดงบนกระทงของคุณได้เลย (ตั้งชื่ออะไรก็ได้)</p>
      <form id="nameForm">
        <input id="playerNameInput" class="input-name" type="text" maxlength="24" placeholder="พิมพ์ชื่อที่อยากให้แสดง..." required />
        <button class="btn" type="submit">ไปทำแบบสอบถาม 20 ข้อ →</button>
      </form>
    </div>
  </section>

  <!-- หน้า 2: แบบสอบถาม 20 ข้อ -->
  <section id="screenQuiz" class="screen">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h2 style="margin:0;">แบบสอบถามบุคลิก 20 ข้อ</h2>
        <span id="progressText" style="color:var(--muted); font-weight:600;">ตอบแล้ว 0 / 20</span>
      </div>
      <div id="questionsList"></div>
      <button id="submitQuizBtn" class="btn" style="width:100%; margin-top:10px;" disabled>ดูผลลัพธ์กระทงแมวของฉัน</button>
    </div>
  </section>

  <!-- หน้า 3: ผลลัพธ์แมว -->
  <section id="screenResult" class="screen">
    <div class="card" style="text-align:center;">
      <p id="resultPlayerSub" style="color:var(--muted); margin-bottom:4px;"></p>
      <h2 id="resultCatTitle" style="font-size:1.6rem;"></h2>
      <img id="resultCatImg" class="result-img" src="" alt="" />
      <p id="resultCatDesc" style="color:var(--muted); line-height:1.6; max-width:520px; margin:0 auto 22px;"></p>
      <button id="goFloatBtn" class="btn">นำไปลอยกระทง</button>
    </div>
  </section>

  <!-- หน้า 4: หน้าต่างลอยกระทง -->
  <section id="screenRiver" class="screen river-screen">
    <div class="river-top-bar">
      <div>
        <strong>แม่น้ำหน้าวัด</strong> • <span id="riverStatusText" style="color:var(--muted); font-size:0.9rem;">กำลังแสดงกระทงของผู้ร่วมลอยจริง (สูงสุด 10 ลำ)</span>
      </div>
      <button id="restartBtn" class="btn" style="padding:8px 14px; font-size:0.88rem;">เริ่มใหม่</button>
    </div>
    <div id="riverStage" class="river-stage">
      <svg class="night-scene-svg" viewBox="0 0 1440 820" preserveAspectRatio="xMidYMid slice">
        <defs>
          <radialGradient id="buddhaAura" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFE699" stop-opacity="0.55" />
            <stop offset="60%" stop-color="#F7C566" stop-opacity="0.16" />
            <stop offset="100%" stop-color="#2E3463" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="waterNightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#23436E" />
            <stop offset="50%" stop-color="#1A3254" />
            <stop offset="100%" stop-color="#10213A" />
          </linearGradient>
        </defs>

        <!-- ดวงดาวและก้อนเมฆยามค่ำคืน -->
        <g fill="#FFF5CC" opacity="0.85">
          <circle cx="140" cy="85" r="2.2" />
          <circle cx="290" cy="130" r="1.8" />
          <circle cx="430" cy="70" r="2.5" />
          <circle cx="980" cy="90" r="2.2" />
          <circle cx="1160" cy="65" r="2.8" />
          <circle cx="1310" cy="125" r="2" />
        </g>

        <path d="M120,175 Q150,145 195,155 Q230,130 275,152 Q315,155 320,185 Z" fill="#465084" stroke="#181C34" stroke-width="2" />
        <path d="M1040,145 Q1075,112 1125,124 Q1170,96 1225,120 Q1270,122 1278,155 Z" fill="#465084" stroke="#181C34" stroke-width="2" />

        <!-- แนวต้นไม้ริมฝั่ง -->
        <path d="M0,375 Q90,340 190,368 Q290,335 400,368 Q510,345 620,370 Q760,340 900,370 Q1050,338 1200,365 Q1330,345 1440,368 L1440,425 L0,425 Z" fill="#233C4B" stroke="#14222B" stroke-width="2.2" />

        <!-- เรือนไทยและศาลาข้างเคียง -->
        <g stroke="#1C2033" stroke-width="2.2" stroke-linejoin="round">
          <rect x="210" y="348" width="130" height="54" rx="4" fill="#E8CFC4" />
          <polygon points="194,348 275,305 356,348" fill="#C97A8A" />
          <rect x="258" y="366" width="28" height="36" fill="#F6C87B" opacity="0.85" />

          <rect x="1080" y="352" width="145" height="52" rx="4" fill="#D5DFEB" />
          <polygon points="1064,352 1152,310 1240,352" fill="#B87688" />
          <rect x="1115" y="368" width="24" height="24" rx="2" fill="#F6C87B" opacity="0.85" />
          <rect x="1158" y="368" width="24" height="24" rx="2" fill="#F6C87B" opacity="0.85" />
        </g>

        <!-- แสงนวลรอบพระพุทธรูปและองค์พระสงบตามพุทธศิลป์ -->
        <circle cx="720" cy="295" r="190" fill="url(#buddhaAura)" />
        <g stroke="#2C261E" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
          <!-- ฐานบัว -->
          <path d="M585,405 Q720,392 855,405 L842,424 Q720,414 598,424 Z" fill="#E5BA63" />
          <!-- ลำองค์และพระชงฆ์ -->
          <path d="M645,398 C642,350 658,315 684,295 L756,295 C782,315 798,350 795,398 Z" fill="#F3CA6B" />
          <path d="M612,396 C622,365 668,364 720,378 C772,364 818,365 828,396 C805,406 755,404 720,394 C685,404 635,406 612,396 Z" fill="#F7D37B" />
          <!-- พระกรวางสงบบนตัก -->
          <path d="M668,342 C662,364 684,376 720,376 C756,376 778,364 772,342" fill="none" stroke="#2C261E" stroke-width="2.2" />
          <!-- พระศอและพระเศียร -->
          <rect x="706" y="274" width="28" height="24" rx="6" fill="#F3CA6B" />
          <path d="M694,252 C694,228 706,216 720,216 C734,216 746,228 746,252 C746,270 735,280 720,280 C705,280 694,270 694,252 Z" fill="#F7D37B" />
          <!-- พระเกตุมาลา -->
          <path d="M711,217 L720,176 L729,217 Z" fill="#F7D37B" />
          <!-- พระพักตร์สงบสำรวม -->
          <path d="M703,245 Q709,241 715,244" fill="none" stroke="#2C261E" stroke-width="1.9" />
          <path d="M725,244 Q731,241 737,245" fill="none" stroke="#2C261E" stroke-width="1.9" />
          <path d="M720,247 L719,257 L722,258" fill="none" stroke="#2C261E" stroke-width="1.7" />
          <path d="M714,265 Q720,268 726,265" fill="none" stroke="#2C261E" stroke-width="1.8" />
        </g>

        <!-- เขื่อนริมน้ำ -->
        <rect x="0" y="408" width="1440" height="24" fill="#6D6A78" stroke="#1D2030" stroke-width="2" />
        <line x1="0" y1="420" x2="1440" y2="420" stroke="#9A96A8" stroke-width="1.4" stroke-dasharray="14 10" />

        <!-- ผืนแม่น้ำและระลอกคลื่น -->
        <rect x="0" y="432" width="1440" height="388" fill="url(#waterNightGrad)" />
        <!-- แสงสะท้อนบนผิวน้ำ -->
        <ellipse cx="720" cy="462" rx="58" ry="11" fill="#F7D37B" opacity="0.26" />
        <ellipse cx="720" cy="492" rx="42" ry="8" fill="#F7D37B" opacity="0.18" />

        <g fill="none" stroke="#5A8AC2" stroke-width="2" stroke-linecap="round" opacity="0.65">
          <path d="M120,475 Q175,468 230,475" />
          <path d="M410,515 Q480,506 550,515" />
          <path d="M920,485 Q990,476 1060,485" />
          <path d="M1180,535 Q1255,526 1330,535" />
          <path d="M240,615 Q325,604 410,615" />
          <path d="M780,645 Q865,634 950,645" />
          <path d="M1060,715 Q1150,704 1240,715" />
        </g>
      </svg>
    </div>
  </section>

  <script>
    const CATS = {
      tabby: {
        name: "แมวสลิดเทา",
        img: "assets/cat-tabby.png",
        desc: "นิสัยชิวๆ ตามใจฉัน ตามอารมณ์ตัวเอง"
      },
      wichianmat: {
        name: "แมววิเชียรมาศ",
        img: "assets/cat-wichianmat.png",
        desc: "ดูเป็นผู้ดีขี้แกล้ง ชอบเล่นอะไรเล็กๆ แกล้งอะไรหน่อยๆ แต่ก็ยังคงความผู้ดี"
      },
      orange: {
        name: "แมวส้ม",
        img: "assets/cat-orange.png",
        desc: "ขี้แกล้ง ขี้เล่น กวนตีน ดื้อ แมวเป้าสุดๆ"
      },
      black: {
        name: "แมวดำ",
        img: "assets/cat-black.png",
        desc: "ขี้เซา สบายๆ ชอบนอน น่ารัก"
      },
      white: {
        name: "แมวขาว",
        img: "assets/cat-white.png",
        desc: "ผู้ดีแท้ๆ ดูสง่าไปหมด"
      },
      seal: {
        name: "แมวน้ำ",
        img: "assets/cat-seal.png",
        desc: "ตัวซีเคร็ท ไม่มีใครเหมือน แปลกและแตกต่าง อ้วน"
      }
    };

    const QUESTIONS = [
      { id: 1, q: "1) นอนตื่น 8 โมง", opts: { always: ["white", "seal"], sometimes: ["tabby", "orange"], never: ["black", "wichianmat"] } },
      { id: 2, q: "2) ชอบไปเล่นกับแมว", opts: { always: ["orange", "white"], sometimes: ["wichianmat", "black"], never: ["seal", "tabby"] } },
      { id: 3, q: "3) เห็นแมวทีไร ชอบเอามือถือขึ้นมาถ่าย", opts: { always: ["wichianmat", "tabby"], sometimes: ["orange", "black"], never: ["white", "seal"] } },
      { id: 4, q: "4) เข้าเรียนทุกคาบไม่เคยขาด", opts: { always: ["white", "orange"], sometimes: ["tabby", "wichianmat"], never: ["black", "seal"] } },
      { id: 5, q: "5) กินข้าวเสร็จคนสุดท้ายของกลุ่มเสมอ", opts: { always: ["black", "wichianmat"], sometimes: ["seal", "white"], never: ["orange", "tabby"] } },
      { id: 6, q: "6) ได้เกรด 3.5 ขึ้นไป", opts: { always: ["white", "black"], sometimes: ["wichianmat", "orange"], never: ["seal", "tabby"] } },
      { id: 7, q: "7) ติดของหวาน", opts: { always: ["seal", "white"], sometimes: ["orange", "black"], never: ["tabby", "wichianmat"] } },
      { id: 8, q: "8) ชอบกินเผ็ด", opts: { always: ["orange", "tabby"], sometimes: ["wichianmat", "seal"], never: ["black", "white"] } },
      { id: 9, q: "9) รับรางวัลหน้าเสาธง", opts: { always: ["white", "orange"], sometimes: ["wichianmat", "black"], never: ["tabby", "seal"] } },
      { id: 10, q: "10) ชอบอ้อนแฟน", opts: { always: ["orange", "white"], sometimes: ["black", "wichianmat"], never: ["seal", "tabby"] } },
      { id: 11, q: "11) ชอบประหยัด", opts: { always: ["black", "seal"], sometimes: ["tabby", "orange"], never: ["wichianmat", "white"] } },
      { id: 12, q: "12) ส่งงานตรงเวลา", opts: { always: ["wichianmat", "tabby"], sometimes: ["white", "black"], never: ["orange", "seal"] } },
      { id: 13, q: "13) ชอบหลับในคาบ", opts: { always: ["black", "white"], sometimes: ["tabby", "wichianmat"], never: ["orange", "seal"] } },
      { id: 14, q: "14) นั่งนิ่งๆ แต่จริงๆ นั่งคิดอะไรไปเรื่อย", opts: { always: ["tabby", "orange"], sometimes: ["seal", "white"], never: ["wichianmat", "black"] } },
      { id: 15, q: "15) ชอบบิดขี้เกียจ", opts: { always: ["black", "wichianmat"], sometimes: ["tabby", "white"], never: ["orange", "seal"] } },
      { id: 16, q: "16) นอนดึก", opts: { always: ["tabby", "white"], sometimes: ["orange", "black"], never: ["wichianmat", "seal"] } },
      { id: 17, q: "17) จีบคนเก่ง", opts: { always: ["orange", "white"], sometimes: ["wichianmat", "seal"], never: ["tabby", "black"] } },
      { id: 18, q: "18) ชอบกอดแม่", opts: { always: ["black", "tabby"], sometimes: ["wichianmat", "seal"], never: ["white", "orange"] } },
      { id: 19, q: "19) ชอบดูอนิเมะ", opts: { always: ["seal", "tabby"], sometimes: ["white", "orange"], never: ["black", "wichianmat"] } },
      { id: 20, q: "20) ติดซีรี่ย์", opts: { always: ["seal", "black"], sometimes: ["tabby", "orange"], never: ["white", "wichianmat"] } }
    ];

    let playerName = "";
    let answers = {};
    let chosenCatKey = "tabby";
    let spawnTimer = null;
    let pendingQueue = [];
    let activeIds = new Set();
    let laneIndex = 0;
    const MAX_ON_SCREEN = 10;
    const LANES_TOP_PCT = [58, 66, 74, 82, 88];

    function showScreen(id) {
      document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    function renderQuestions() {
      const wrap = document.getElementById("questionsList");
      wrap.innerHTML = QUESTIONS.map((item) => `
        <div class="q-box">
          <div class="q-title">${item.q}</div>
          <div class="choices">
            <button type="button" class="choice-btn" data-qid="${item.id}" data-val="always">ประจำ</button>
            <button type="button" class="choice-btn" data-qid="${item.id}" data-val="sometimes">บางครั้ง</button>
            <button type="button" class="choice-btn" data-qid="${item.id}" data-val="never">ไม่เคย</button>
          </div>
        </div>
      `).join("");

      wrap.querySelectorAll(".choice-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const qid = Number(btn.dataset.qid);
          const val = btn.dataset.val;
          answers[qid] = val;
          wrap.querySelectorAll(`[data-qid="${qid}"]`).forEach((b) => b.classList.remove("selected"));
          btn.classList.add("selected");
          const count = Object.keys(answers).length;
          document.getElementById("progressText").innerText = `ตอบแล้ว ${count} / 20`;
          document.getElementById("submitQuizBtn").disabled = count < 20;
        });
      });
    }

    function calculateWinnerCat() {
      const scores = { tabby: 0, wichianmat: 0, orange: 0, black: 0, white: 0, seal: 0 };
      QUESTIONS.forEach((item) => {
        const picked = answers[item.id];
        const [plusCat, minusCat] = item.opts[picked];
        scores[plusCat] += 1;
        scores[minusCat] -= 1;
      });

      const maxScore = Math.max(...Object.values(scores));
      const topCats = Object.keys(scores).filter((k) => scores[k] === maxScore);
      return topCats[Math.floor(Math.random() * topCats.length)];
    }

    function getRealKrathongs() {
      const raw = JSON.parse(localStorage.getItem("krathong_real_pool_v1") || "[]");
      let upgraded = false;
      const list = raw.map((item, idx) => {
        if (!item.id) {
          upgraded = true;
          return { ...item, id: `legacy_${idx}_${item.name}_${item.cat}` };
        }
        return item;
      });
      if (upgraded) {
        localStorage.setItem("krathong_real_pool_v1", JSON.stringify(list));
      }
      return list;
    }

    function saveMyKrathongToPool(entry) {
      const saved = getRealKrathongs();
      saved.unshift(entry);
      localStorage.setItem("krathong_real_pool_v1", JSON.stringify(saved.slice(0, 80)));
    }

    function spawnOneKrathong(entry) {
      const stage = document.getElementById("riverStage");
      if (!stage || !entry || activeIds.has(entry.id) || activeIds.size >= MAX_ON_SCREEN) return;

      const cat = CATS[entry.cat] || CATS.tabby;
      const el = document.createElement("div");
      el.className = "floating-krathong";
      const topPct = LANES_TOP_PCT[laneIndex % LANES_TOP_PCT.length];
      laneIndex += 1;
      const durationSec = 14 + Math.random() * 4;

      el.style.top = `${topPct}%`;
      el.style.animationDuration = `${durationSec}s`;
      el.innerHTML = `<img src="${cat.img}" alt="${cat.name}" /><span class="krathong-tag">${entry.name}</span>`;

      activeIds.add(entry.id);
      stage.appendChild(el);

      el.addEventListener("animationend", () => {
        el.remove();
        activeIds.delete(entry.id);
      });
    }

    function spawnNextAvailable() {
      const pool = getRealKrathongs();
      if (!pool.length) return;
      const cap = Math.min(MAX_ON_SCREEN, pool.length);
      if (activeIds.size >= cap) return;

      while (pendingQueue.length > 0) {
        const queued = pendingQueue.shift();
        if (queued && !activeIds.has(queued.id)) {
          spawnOneKrathong(queued);
          return;
        }
      }

      const available = pool.filter((item) => !activeIds.has(item.id));
      if (!available.length) return;
      const picked = available[Math.floor(Math.random() * available.length)];
      spawnOneKrathong(picked);
    }

    function startRiverLoop() {
      clearInterval(spawnTimer);
      document.querySelectorAll(".floating-krathong").forEach((n) => n.remove());
      activeIds.clear();
      laneIndex = 0;

      const myItem = {
        id: `kr_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        name: playerName,
        cat: chosenCatKey
      };
      saveMyKrathongToPool(myItem);
      pendingQueue = [myItem];
      spawnNextAvailable();

      spawnTimer = setInterval(() => {
        spawnNextAvailable();
      }, 2200);
    }

    document.getElementById("nameForm").addEventListener("submit", (e) => {
      e.preventDefault();
      playerName = document.getElementById("playerNameInput").value.trim() || "ผู้ร่วมลอย";
      answers = {};
      renderQuestions();
      document.getElementById("progressText").innerText = "ตอบแล้ว 0 / 20";
      document.getElementById("submitQuizBtn").disabled = true;
      showScreen("screenQuiz");
    });

    document.getElementById("submitQuizBtn").addEventListener("click", () => {
      chosenCatKey = calculateWinnerCat();
      const cat = CATS[chosenCatKey];
      document.getElementById("resultPlayerSub").innerText = `กระทงของ "${playerName}"`;
      document.getElementById("resultCatTitle").innerText = `ได้${cat.name}`;
      document.getElementById("resultCatImg").src = cat.img;
      document.getElementById("resultCatImg").alt = cat.name;
      document.getElementById("resultCatDesc").innerText = cat.desc;
      showScreen("screenResult");
    });

    document.getElementById("goFloatBtn").addEventListener("click", () => {
      showScreen("screenRiver");
      startRiverLoop();
    });

    document.getElementById("restartBtn").addEventListener("click", () => {
      clearInterval(spawnTimer);
      activeIds.clear();
      document.getElementById("playerNameInput").value = "";
      showScreen("screenName");
    });
  </script>
</body>
</html>
